{% set name = "digitalearth" %}
{% set version = "0.15.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/serapeum-org/Digital-Earth/archive/{{ version }}.tar.gz
  sha256: a56ecca8e138f6c17a439ac979bb2b855c9c012e9da80d14883e2df8ea398830

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=80.0.0
    - wheel
  run:
    - python >={{ python_min }}
    - numpy >=2.0.0
    - pandas >=2.0.0
    - matplotlib-base >=3.11
    - geopandas >=1.1.3
    # cleopatra[tiles] on PyPI -> the cleopatra-tiles output on conda-forge (pulls cleopatra + tile deps).
    - cleopatra-tiles >=0.45.0
    - xyzservices >=2023.10.0
    # pyramids-core on PyPI is published as `pyramids` on conda-forge (same version line).
    - pyramids >=0.77.0
    - loguru >=0.7.3
    - pyyaml >=6.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - digitalearth
    - digitalearth.static
    - digitalearth.base
  commands:
    - pip check
    - digitalearth --help

outputs:
  - name: {{ name }}

  - name: {{ name }}-3d
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
        # mirrors the PyPI ``digitalearth[3d]`` extra: the PyVista true-3D tier (Scene3D) with pyvista's
        # jupyter export stack (trame/vtk.js), the textured-globe backend, and the animation writers.
        - pyvista >=0.48
        - trame >=3.13
        - trame-vtk >=2.8
        - trame-vuetify >=2.7
        - ipywidgets >=8.0
        - geovista >=0.5.3
        - imageio >=2.34
        - imageio-ffmpeg >=0.5
        # NOTE: the PyPI extra also lists ``pointclouds >=0.1.0`` (optional LAS/LAZ reading for
        # ``point_cloud(<path>)``, lazily imported). It is not yet on conda-forge, so it is omitted here;
        # the rest of the 3-D tier works without it. Add it once a pointclouds feedstock exists.
    test:
      imports:
        - digitalearth

about:
  home: https://github.com/serapeum-org/Digital-Earth
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.md
  summary: Geospatial visualization package for rasters and vector data
  description: |
    digitalearth is a geospatial visualization package: it plots rasters and
    vector data by wiring pyramids (GIS) data into cleopatra (matplotlib)
    glyphs. It provides maps and raster fields, point/cell and vector-field
    plots, unstructured meshes, composites, ensemble/temporal series,
    projected and globe maps, animations, charts, automatic field styling,
    and a batch / HTML-gallery / CLI delivery tier.
  dev_url: https://github.com/serapeum-org/Digital-Earth
  doc_url: https://serapeum-org.github.io/Digital-Earth

extra:
  recipe-maintainers:
    - MAfarrag
